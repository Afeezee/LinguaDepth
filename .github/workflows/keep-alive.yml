# Keep the free-tier Render web service warm.
#
# Render's free plan spins the service down after ~15 minutes of inactivity.
# A cold boot then takes 30–60 seconds, which pilot testers notice. This
# workflow pings /api/health every 10 minutes so the service never drifts
# into the sleep window.
#
# GitHub Actions scheduled runs can be delayed by up to ~15 minutes under
# platform load, so this is a BEST-EFFORT keep-alive. For hard-SLA uptime
# you'd pay for Render Standard ($7/mo) and remove this file.
#
# The health URL is read from the KEEP_ALIVE_URL repo variable (Settings →
# Secrets and variables → Actions → Variables), e.g.
#   https://linguadepth.onrender.com/api/health
# Keeping it in a repo variable (not a secret) means it's visible in logs
# but changeable without a commit.

name: Keep Render service warm

on:
  schedule:
    # Every 10 minutes. First field is minute: 0, 10, 20, 30, 40, 50.
    - cron: "*/10 * * * *"
  workflow_dispatch:  # also runnable manually from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ vars.KEEP_ALIVE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "KEEP_ALIVE_URL repo variable isn't set. Skipping."
            exit 0
          fi

          # Give Render up to 90 s to respond — a cold start on free tier
          # can take almost that long. --fail promotes an HTTP 5xx to a
          # non-zero exit, but we deliberately swallow failures so a one-
          # off hiccup doesn't send a workflow-failed email every 10 min.
          HTTP=$(curl --silent --output /dev/null \
                       --max-time 90 --retry 2 --retry-delay 5 \
                       --write-out "%{http_code}" \
                       "$URL" || echo "000")
          echo "GET $URL  →  HTTP $HTTP"
          # Treat 2xx/3xx as success; log anything else for the Actions tab.
          case "$HTTP" in
            2*|3*) echo "ok" ;;
            *)     echo "warn: non-success status; service may be waking up or offline" ;;
          esac
